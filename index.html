<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA & Arbeitskleidung Verwaltung</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">PSA</div>
                <h1 class="text-xl font-bold text-slate-900">PSA & Kleidungsinventar</h1>
            </div>
            <button onclick="loadData()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-3 rounded-md transition flex items-center gap-2">
                🔄 Daten aktualisieren
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Artikel Typen</p>
                <p id="kpi-typen" class="text-3xl font-bold text-slate-900 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Gesamtbestand Stk.</p>
                <p id="kpi-bestand" class="text-3xl font-bold text-blue-600 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Kritischer Bestand (&le; Min)</p>
                <p id="kpi-kritisch" class="text-3xl font-bold text-amber-600 mt-2">-</p>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left: Issuance Form -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">
                <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Neue Zuweisung buchen</h2>
                
                <form id="issueForm" onsubmit="submitBooking(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Mitarbeiter</label>
                        <select id="selectMitarbeiter" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Lade Mitarbeiter...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Artikel</label>
                        <select id="selectArtikel" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Lade Artikel...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Größe</label>
                            <input type="text" id="inputGroesse" placeholder="z.B. XL / 43" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Menge</label>
                            <input type="number" id="inputMenge" value="1" min="1" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Bemerkung</label>
                        <input type="text" id="inputBemerkung" placeholder="z.B. Erstausstattung" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition shadow-sm">
                        Zuweisung Buchen
                    </button>
                </form>
            </div>

            <!-- Right: Tables -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- Inventory Table -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900">
                        Aktueller Lagerbestand
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 text-slate-700 uppercase text-xs border-b border-slate-100">
                                <tr>
                                    <th class="px-6 py-3">Bezeichnung</th>
                                    <th class="px-6 py-3">Kategorie</th>
                                    <th class="px-6 py-3">Größe</th>
                                    <th class="px-6 py-3">Ist-Bestand</th>
                                    <th class="px-6 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tblArtikel" class="divide-y divide-slate-100">
                                <tr><td colspan="5" class="px-6 py-4 text-center">Daten werden geladen...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- History Table -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900">
                        Letzte Zuweisungen
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 text-slate-700 uppercase text-xs border-b border-slate-100">
                                <tr>
                                    <th class="px-6 py-3">Datum</th>
                                    <th class="px-6 py-3">Mitarbeiter</th>
                                    <th class="px-6 py-3">Artikel</th>
                                    <th class="px-6 py-3">Größe</th>
                                    <th class="px-6 py-3">Menge</th>
                                </tr>
                            </thead>
                            <tbody id="tblZuweisungen" class="divide-y divide-slate-100">
                                <tr><td colspan="5" class="px-6 py-4 text-center">Daten werden geladen...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz9hBVya0edfHi6RXpURsa1en319qmRywiHjKbwe_UScQyJQxoQ4s9WX_pZyQlkI5E2/exec";
        let globalData = {};

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                globalData = await res.json();
                
                renderKPIs();
                renderDropdowns();
                renderTables();
            } catch (err) {
                alert("Fehler beim Laden der Daten aus Google Sheets.");
                console.error(err);
            }
        }

        function renderKPIs() {
            const artikel = globalData.artikel || [];
            document.getElementById("kpi-typen").innerText = artikel.length;
            
            const totalStock = artikel.reduce((acc, curr) => acc + (parseInt(curr.IstBestand) || 0), 0);
            document.getElementById("kpi-bestand").innerText = totalStock;

            const critical = artikel.filter(a => parseInt(a.IstBestand) <= parseInt(a.SollMinimum)).length;
            document.getElementById("kpi-kritisch").innerText = critical;
        }

        function renderDropdowns() {
            const maSelect = document.getElementById("selectMitarbeiter");
            maSelect.innerHTML = '<option value="">-- Mitarbeiter wählen --</option>';
            (globalData.mitarbeiter || []).forEach(m => {
                maSelect.innerHTML += `<option value="${m.Name}">${m.Name} (${m.Abteilung})</option>`;
            });

            const artSelect = document.getElementById("selectArtikel");
            artSelect.innerHTML = '<option value="">-- Artikel wählen --</option>';
            
            // Unikate Artikelnamen
            const uniqueArt = [...new Set((globalData.artikel || []).map(a => a.Bezeichnung))];
            uniqueArt.forEach(a => {
                artSelect.innerHTML += `<option value="${a}">${a}</option>`;
            });
        }

        function renderTables() {
            // Artikel Tabelle
            const tblArt = document.getElementById("tblArtikel");
            tblArt.innerHTML = "";
            (globalData.artikel || []).forEach(a => {
                const isLow = parseInt(a.IstBestand) <= parseInt(a.SollMinimum);
                const badge = isLow 
                    ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-semibold">Nachbestellen</span>`
                    : `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-semibold">OK</span>`;

                tblArt.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 font-medium text-slate-900">${a.Bezeichnung}</td>
                        <td class="px-6 py-4">${a.Kategorie}</td>
                        <td class="px-6 py-4">${a.Groesse}</td>
                        <td class="px-6 py-4 font-bold ${isLow ? 'text-red-600' : 'text-slate-900'}">${a.IstBestand}</td>
                        <td class="px-6 py-4">${badge}</td>
                    </tr>
                `;
            });

            // Zuweisungen Tabelle (neueste zuerst)
            const tblZuw = document.getElementById("tblZuweisungen");
            tblZuw.innerHTML = "";
            const list = [...(globalData.zuweisungen || [])].reverse();
            list.forEach(z => {
                const date = z.Zeitstempel ? new Date(z.Zeitstempel).toLocaleDateString("de-DE") : "-";
                tblZuw.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4">${date}</td>
                        <td class="px-6 py-4 font-medium text-slate-900">${z.MitarbeiterName}</td>
                        <td class="px-6 py-4">${z.ArtikelName}</td>
                        <td class="px-6 py-4">${z.Groesse}</td>
                        <td class="px-6 py-4 font-bold">${z.Menge}</td>
                    </tr>
                `;
            });
        }

        async function submitBooking(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "Wird gebucht...";

            const payload = {
                action: "buchen",
                mitarbeiterName: document.getElementById("selectMitarbeiter").value,
                artikelName: document.getElementById("selectArtikel").value,
                groesse: document.getElementById("inputGroesse").value,
                menge: document.getElementById("inputMenge").value,
                bemerkung: document.getElementById("inputBemerkung").value
            };

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                document.getElementById("issueForm").reset();
                await loadData();
                alert("Zuweisung erfolgreich gebucht!");
            } catch (err) {
                alert("Fehler beim Buchen.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Zuweisung Buchen";
            }
        }

        // Initiales Laden
        loadData();
    </script>
</body>
</html>
